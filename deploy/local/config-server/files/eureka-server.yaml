eureka:
  client:
    register-with-eureka: false  # Ne pas s'enregistrer soi-même
    fetch-registry: false        # Ne pas récupérer le registre (il est le registre)
    service-url:
      defaultZone: http://${EUREKA_HOST:discovery-service}:8761/eureka/ # L'URL de ton serveur

  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    wait-time-in-ms-when-sync-empty: 5  # ⚡ Ajoute cette ligne
