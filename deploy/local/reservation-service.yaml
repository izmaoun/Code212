apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  namespace: code212
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reservation-service
  template:
    metadata:
      labels:
        app: reservation-service
    spec:
      enableServiceLinks: false
      containers:
        - name: reservation-service
          image: code212/reservation-service:24
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:ActiveProcessorCount=2 -Xmx256m"
            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-service:9999
            - name: CONFIG_SERVER_URL
              value: http://config-service:9999
            - name: EUREKA_HOST
              value: discovery-service
            - name: DB_HOST
              value: reservation-db
            - name: DB_PORT
              value: "5432"
            - name: RESOURCE_SERVICE_HOST
              value: resource-service
            - name: RESOURCE_SERVICE_PORT
              value: "8082"
            - name: DB_NAME
              value: reservation_db
            - name: DB_USER
              value: reservation_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservation-db-credentials
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reservation-service
  namespace: code212
spec:
  selector:
    app: reservation-service
  ports:
    - name: http
      port: 8083
      targetPort: http
