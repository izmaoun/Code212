networks:
  code212-net:
    driver: bridge

volumes:
  keycloak_db_data:
  resource_db_data:
  reservation_db_data:

services:

  # ═══════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak_user}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - code212-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: keycloak
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak_user}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8090
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8090:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - code212-net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # CONFIG-SERVICE
  # ═══════════════════════════════════════════════════════════════

  config-service:
    build:
      context: ./config-service
      dockerfile: Dockerfile
    image: code212/config-service:1.0.0
    container_name: config-service
    environment:
      CONFIG_REPO_PATH: /config-repo
    volumes:
      - ./config-repo:/config-repo
    ports:
      - "9999:9999"
    networks:
      - code212-net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # DISCOVERY-SERVICE
  # ═══════════════════════════════════════════════════════════════

  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    image: code212/discovery-service:1.0.0
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - code212-net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # RESOURCE-SERVICE
  # ═══════════════════════════════════════════════════════════════

  resource-db:
    image: postgres:16-alpine
    container_name: resource-db
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME:-resource_db}
      POSTGRES_USER: ${RESOURCE_DB_USER:-resource_user}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:-resource_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - resource_db_data:/var/lib/postgresql/data
    networks:
      - code212-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_DB_USER:-resource_user} -d ${RESOURCE_DB_NAME:-resource_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  resource-service:
    build:
      context: ./resource-service
      dockerfile: Dockerfile
    image: code212/resource-service:1.0.0
    container_name: resource-service
    environment:
      # Config Server
      CONFIG_SERVER_URL: http://config-service:9999
      # Base de données
      DB_HOST: resource-db
      DB_PORT: 5432
      DB_NAME: ${RESOURCE_DB_NAME:-resource_db}
      DB_USER: ${RESOURCE_DB_USER:-resource_user}
      DB_PASSWORD: ${RESOURCE_DB_PASSWORD:-resource_pass}
      # Eureka
      EUREKA_HOST: discovery-service
      EUREKA_PORT: 8761
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      # Keycloak
      KEYCLOAK_HOST: localhost
      KEYCLOAK_PORT: 8090
      KEYCLOAK_INTERNAL: keycloak
      KEYCLOAK_INTERNAL_PORT: 8080
    ports:
      - "8082:8082"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      resource-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - code212-net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # RESERVATION-SERVICE
  # ═══════════════════════════════════════════════════════════════

  reservation-db:
    image: postgres:16-alpine
    container_name: reservation-db
    environment:
      POSTGRES_DB: ${RESERVATION_DB_NAME:-reservation_db}
      POSTGRES_USER: ${RESERVATION_DB_USER:-reservation_user}
      POSTGRES_PASSWORD: ${RESERVATION_DB_PASSWORD:-reservation_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - reservation_db_data:/var/lib/postgresql/data
    networks:
      - code212-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESERVATION_DB_USER:-reservation_user} -d ${RESERVATION_DB_NAME:-reservation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  reservation-service:
    build:
      context: ./reservation-service
      dockerfile: Dockerfile
    image: code212/reservation-service:1.0.0
    container_name: reservation-service
    environment:
      # Config Server
      CONFIG_SERVER_URL: http://config-service:9999
      # Base de données
      DB_HOST: reservation-db
      DB_PORT: 5432
      DB_NAME: ${RESERVATION_DB_NAME:-reservation_db}
      DB_USER: ${RESERVATION_DB_USER:-reservation_user}
      DB_PASSWORD: ${RESERVATION_DB_PASSWORD:-reservation_pass}
      # Eureka
      EUREKA_HOST: discovery-service
      EUREKA_PORT: 8761
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      # Feign
      RESOURCE_SERVICE_HOST: resource-service
      RESOURCE_SERVICE_PORT: 8082
      # Keycloak
      KEYCLOAK_HOST: localhost
      KEYCLOAK_PORT: 8090
      KEYCLOAK_INTERNAL: keycloak
      KEYCLOAK_INTERNAL_PORT: 8080
    ports:
      - "8083:8083"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      reservation-db:
        condition: service_healthy
      resource-service:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - code212-net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # GATEWAY-SERVICE
  # ═══════════════════════════════════════════════════════════════

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    image: code212/gateway-service:1.0.0
    container_name: gateway-service
    environment:
      CONFIG_SERVER_URL: http://config-service:9999
      EUREKA_HOST: discovery-service
      EUREKA_PORT: 8761
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Deureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/"

    ports:
      - "8888:8888"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - code212-net
    restart: unless-stopped