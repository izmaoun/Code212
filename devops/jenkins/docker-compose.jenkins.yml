
networks:
  jenkins-net:
    driver: bridge

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:

services:

  # ═══════════════════════════════════════════════════════════════
  # JENKINS — Serveur CI/CD
  # ═══════════════════════════════════════════════════════════════
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    privileged: true                    # Nécessaire pour Docker-in-Docker
    user: root
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_OPTS=--httpPort=8080
    ports:
      - "8080:8080"                     # UI Jenkins
      - "50000:50000"                   # Agents
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Accès au Docker host
      - ./plugins.txt:/usr/share/jenkins/ref/plugins.txt
    networks:
      - jnkins-nete
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # SONARQUBE — Analyse de code
  # ═══════════════════════════════════════════════════════════════
  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - jenkins-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:9.9-community      # ← Version LTS
    container_name: sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"    # 🆕

    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - jenkins-net
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096

  # ═══════════════════════════════════════════════════════════════
  # NEXUS — Registre d'artefacts (optionnel)
  # ═══════════════════════════════════════════════════════════════
  # nexus:
  #   image: sonatype/nexus3:latest
  #   container_name: nexus
  #   ports:
  #     - "8081:8081"
  #   volumes:
  #     - nexus_data:/nexus-data
  #   networks:
  #     - jenkins-net