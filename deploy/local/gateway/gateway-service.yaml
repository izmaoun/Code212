apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: code212
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      enableServiceLinks: false
      containers:
        - name: gateway-service
          image: code212/gateway-service:24
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:ActiveProcessorCount=2 -Xmx256m"
            - name: CONFIG_SERVER_URL
              value: http://config-service:9999
            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-service:9999
            - name: EUREKA_HOST
              value: discovery-service
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: code212
spec:
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8888
      targetPort: http
