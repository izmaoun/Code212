
networks:
  jenkins-net:
    driver: bridge

volumes:
  jenkins_home:
  maven_cache:                          # ← AJOUTE CETTE LIGNE
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:

services:

  # ═══════════════════════════════════════════════════════════════
  # JENKINS — Serveur CI/CD
  # ═══════════════════════════════════════════════════════════════
  jenkins:
#    image: jenkins/jenkins:lts-jdk17
    build:
      context: .
      dockerfile: Dockerfile
    image: code212/jenkins:2.0.0
    container_name: jenkins
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "github.com:140.82.121.3"
      - "api.github.com:140.82.121.6"
      - "codeload.github.com:140.82.121.10"
      - "repo.maven.apache.org:104.18.19.12"
      - "repo1.maven.org:104.18.18.12"
      - "deb.debian.org:199.232.34.132"
      - "security.debian.org:151.101.2.132"
      - "download.docker.com:18.67.250.117"    # 🆕 AJOUTER
    privileged: true
    user: root
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_OPTS=--httpPort=8080
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - maven_cache:/root/.m2          # ← AJOUTE CETTE LIGNE
      - /var/run/docker.sock:/var/run/docker.sock
      - ./plugins.txt:/usr/share/jenkins/ref/plugins.txt
    networks:
      - jenkins-net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # SONARQUBE — Analyse de code
  # ═══════════════════════════════════════════════════════════════
  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - jenkins-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:26.9-community      # ✅ dernière version mensuelle
    container_name: sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    healthcheck:
#      test: [ "CMD", "curl", "-f", "http://localhost:9000/api/system/status" ]
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status || wget --spider -q http://localhost:9000/api/system/status"]
      interval: 30s        # Teste toutes les 30s
      timeout: 10s         # Attend 10s max par test
      retries: 5           # 5 échecs = "unhealthy"
      start_period: 180s   # Donne 3 min de grâce au démarrage (SonarQube est lent)
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - jenkins-net
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096

  # ═══════════════════════════════════════════════════════════════
  # NEXUS — Registre d'artefacts (optionnel)
  # ═══════════════════════════════════════════════════════════════
  # nexus:
  #   image: sonatype/nexus3:latest
  #   container_name: nexus
  #   ports:
  #     - "8081:8081"
  #   volumes:
  #     - nexus_data:/nexus-data
  #   networks:
  #     - jenkins-net