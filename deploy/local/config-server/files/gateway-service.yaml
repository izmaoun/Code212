spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false # On désactive la découverte automatique pour garder le contrôle sur les URLs
      routes:
        - id: resource-service
          uri: lb://RESOURCE-SERVICE
          predicates:
            - Path=/api/resources/**

        - id: reservation-service
          uri: lb://RESERVATION-SERVICE
          predicates:
            - Path=/api/reservations/**
