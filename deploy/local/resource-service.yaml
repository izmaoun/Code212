apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: code212
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
    spec:
      containers:
        - name: resource-service
          image: code212/resource-service:24
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:ActiveProcessorCount=2 -Xmx256m"
            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-service:9999
            - name: EUREKA_HOST
              value: discovery-service
            - name: DB_HOST
              value: resource-db
            - name: DB_NAME
              value: resource_db
            - name: DB_USER
              value: resource_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resource-db-credentials
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: code212
spec:
  selector:
    app: resource-service
  ports:
    - name: http
      port: 8082
      targetPort: http
